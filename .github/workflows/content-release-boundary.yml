name: Staged content boundary
on:
  pull_request:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/weekly-seo-pipeline-test.mjs
        working-directory: trusted
        if: hashFiles('trusted/scripts/content-release-boundary.mjs') != ''
      - name: Keep unapproved draft URLs out of production
        working-directory: trusted
        if: hashFiles('trusted/scripts/content-release-boundary.mjs') != ''
        env:
          CONTENT_ROOT: ${{ github.workspace }}/candidate
          CONTENT_CANDIDATE_BRANCH: ${{ github.head_ref }}
        run: node scripts/content-release-boundary.mjs
      - name: Bootstrap first installation without production writes
        if: hashFiles('trusted/scripts/content-release-boundary.mjs') == ''
        working-directory: candidate
        run: |
          node scripts/weekly-seo-pipeline-test.mjs
          node scripts/content-release-boundary.mjs
